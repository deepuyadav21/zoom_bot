
<!-- form.html -->
{% extends 'base.html' %}
{% block content %}
  <form action="{{ action_url }}" method="post" class="bg-white p-6 shadow-md rounded-lg space-y-4">
    <div>
      <label class="block mb-1 font-medium">Title</label>
      <input type="text" name="title" value="{{ meeting.title if meeting else '' }}" class="w-full border rounded px-3 py-2" required>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block mb-1 font-medium">Meeting ID</label>
        <input type="text" name="meeting_id" value="{{ meeting.meeting_id if meeting else '' }}" class="w-full border rounded px-3 py-2" required>
      </div>
      <div>
        <label class="block mb-1 font-medium">Password</label>
        <input type="text" name="password" value="{{ meeting.password if meeting else '' }}" class="w-full border rounded px-3 py-2">
      </div>
    </div>

    <div>
      <label class="block mb-1 font-medium">Participant Name</label>
      <input type="text" name="participant_name" value="{{ meeting.participant_name if meeting else '' }}" class="w-full border rounded px-3 py-2">
    </div>

    <div>
      <label class="block mb-1 font-medium">Date & Time</label>
      <input type="datetime-local" name="datetime" value="{{ meeting.datetime if meeting else '' }}" class="w-full border rounded px-3 py-2" required>
    </div>

    <div class="flex gap-4">
      <label class="inline-flex items-center">
        <input type="checkbox" name="mic" {% if meeting and meeting.mic %}checked{% endif %} class="mr-2">
        Mic On
      </label>
      <label class="inline-flex items-center">
        <input type="checkbox" name="camera" {% if meeting and meeting.camera %}checked{% endif %} class="mr-2">
        Camera On
      </label>
    </div>
    <div>    <label for="follow_up">Follow-up Meeting ID (optional)</label>
      <input type="number" name="follow_up_meeting_id" value="{{ meeting.follow_up_meeting_id if meeting else '' }}">
    </div>



    <div class="flex gap-4 mt-4">
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save Meeting</button>
      <a href="/" class="text-gray-600 hover:underline self-center">Cancel</a>
    </div>
  </form>
{% endblock %}
